    <style>
        .scenic-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
            gap: 16px;
            max-width: 1100px;
            margin-top: 24px;
        }

        .scenic-gallery img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
        }
    </style>
</head>
